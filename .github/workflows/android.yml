# Builds the Herdly Android shell (android/) and uploads a debug APK as a run artifact.
# The debug APK is signed with the runner's throwaway debug key: see "Android" in web/README.md.
name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: herdly-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
