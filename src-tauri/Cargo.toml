[package]
name = "herdly"
version = "1.3.2"
description = "Herdly desktop app"
authors = ["Cuong Nguyen"]
edition = "2021"

[workspace]
members = ["core", "web"]
default-members = [".", "core"]

[lib]
# The `_lib` suffix is necessary to keep the lib name unique from the bin name.
name = "herdly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
herdly-core = { path = "core" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
notify = "8"
async-trait = "0.1"
thiserror = "2"
portable-pty = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tar = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-text = "22.0.0"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSUserNotification"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent", "NSResponder", "NSWindow", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }
block2 = "0.6"
