[package]
name = "herdly-web"
version = "0.1.0"
description = "Herdly Web: the phone-facing server over herdly-core"
authors = ["Cuong Nguyen"]
edition = "2021"

[dependencies]
herdly-core = { path = "../core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
libc = "0.2"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.26"
