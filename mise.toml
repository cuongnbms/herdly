# Herdly — Tauri 2 (pnpm + cargo). `mise tasks` lists them, `mise run <task>` runs one.

[env]
APP = "src-tauri/target/release/bundle/macos/Herdly.app"

[tasks.install]
description = "Install frontend dependencies"
run = "pnpm install"

[tasks.dev]
description = "Run the app with hot reload"
run = "pnpm tauri dev"

[tasks.build]
description = "Build the release bundle (Herdly.app)"
run = "pnpm tauri build --bundles app"

[tasks.run]
description = "Build the release bundle and open it"
depends = ["build"]
run = "open $APP"

# Quits a running copy, replaces it so files removed from the bundle don't linger, then signs
# it with the `sign:setup` identity so macOS keeps its permission grants across installs.
# The build output is unregistered from Launch Services so Launchpad lists only the installed
# app, and the new install is opened.
[tasks."install:app"]
description = "Build the release bundle, install it into /Applications and open it"
depends = ["build"]
run = [
  "osascript -e 'if application id \"dev.cuongnb.herdly\" is running then tell application id \"dev.cuongnb.herdly\" to quit'",
  "rm -rf /Applications/Herdly.app",
  "ditto $APP /Applications/Herdly.app",
  "scripts/sign-app.sh /Applications/Herdly.app",
  "/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -u \"$PWD/$APP\"",
  "open /Applications/Herdly.app",
]

# Ad-hoc signed builds get a new identity each time, so macOS asks again for every permission.
[tasks."sign:setup"]
description = "One-time: create the local signing identity install:app signs Herdly.app with"
run = "scripts/sign-setup.sh"

[tasks.typecheck]
description = "Type-check the frontend"
run = "pnpm typecheck"

[tasks."typecheck:web"]
description = "Type-check the Herdly Web UI"
run = "pnpm --dir web typecheck"

[tasks.lint]
description = "Clippy on the backend, warnings as errors"
dir = "src-tauri"
run = "cargo clippy --workspace -- -D warnings"

[tasks."test:frontend"]
description = "Frontend tests (vitest)"
run = "pnpm test"

[tasks."test:web"]
description = "Herdly Web UI tests (vitest)"
run = "pnpm --dir web test"

[tasks."test:backend"]
description = "Backend tests (cargo)"
dir = "src-tauri"
run = "cargo test --workspace"

# A throwaway keychain and a tiny bundle; never the login keychain or /Applications.
[tasks."test:sign"]
description = "Tests for the local signing scripts (macOS)"
run = "scripts/sign.test.sh"

[tasks.test]
description = "Frontend, backend and signing script tests"
depends = ["test:frontend", "test:web", "test:backend", "test:sign"]

# Starts isolated `herdly-test-*` sessions on the local herdr and always
# stops and deletes them. The SSH test only runs when HERDLY_SSH_TEST is set.
[tasks."test:integration"]
description = "Integration tests against a real local herdr"
dir = "src-tauri"
run = "cargo test --workspace -- --ignored --test-threads=1"

[tasks.check]
description = "Typecheck, lint and test"
depends = ["typecheck", "typecheck:web", "lint", "test"]

# Regenerates src-tauri/icons from one square source image. Only needed when the
# icon itself changes; the committed icons are what `build` packages.
[tasks.icon]
description = "Regenerate app icons from a source image"
usage = 'arg "[source]" default="src-tauri/icons/icon.png" help="Square PNG or SVG, 1024px+"'
run = 'pnpm tauri icon "${usage_source}"'

[tasks.clean]
description = "Remove frontend and cargo build output"
run = ["rm -rf dist", "cargo clean --manifest-path src-tauri/Cargo.toml"]
